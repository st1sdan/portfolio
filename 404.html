<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>404 · Stisdan</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .error-code {
            font-family: 'Fraunces', serif;
            font-weight: 400;
            font-size: clamp(5rem, 26vw, 18rem);
            line-height: .9;
            letter-spacing: -.05em;
            margin: 10px 0 6px;
        }

        .error-code .italic {
            font-style: italic;
            color: var(--accent);
        }

        .error-text {
            font-family: 'Fraunces', serif;
            font-weight: 300;
            font-size: clamp(1.3rem, 3.4vw, 2.2rem);
            letter-spacing: -.02em;
            margin-bottom: 34px;
            max-width: 26ch;
        }
    </style>
</head>

<body>
    <header class="site-header">
        <a href="index.html" class="brand"><span class="brand__dot">✦</span>stisdan</a>
        <div class="header-tools">
            <a href="index.html" class="lang-btn" style="text-decoration:none">← home</a>
        </div>
    </header>

    <section class="section theme error-page" data-theme-name="projects">
        <div class="wrap">
            <span class="section__index">(404)</span>
            <h1 class="error-code">4<span class="italic">0</span>4</h1>
            <p class="error-text">This page wandered off somewhere. Let's get you back on track.</p>
            <div class="btn-row">
                <a href="index.html" class="btn btn--primary">Back home ↗</a>
                <a href="index.html#games" class="btn btn--ghost">See the games</a>
            </div>
        </div>
    </section>
</body>

</html>
